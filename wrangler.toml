name = "iron-pulse-gym"
compatibility_date = "2025-09-01"
pages_build_output_dir = "."

# Members, attendance and payments are stored in this D1 database.
# Database "gym-db" on Cloudflare (already created).
[[d1_databases]]
binding = "DB"
database_name = "gym-db"
database_id = "f5ba57b7-e41e-4b67-8282-6b6914c097e8"
migrations_dir = "migrations"

# The owner PIN is a secret, set it with:  npx wrangler pages secret put OWNER_PIN

[vars]
# "1" = test mode: tapping Member or Owner logs in without a PIN. Set to "0" before real customers use the app.
DEMO_LOGIN = "1"
